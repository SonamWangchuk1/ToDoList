{% extends 'base.html' %}
{% block title %}My Todos - Todo App{% endblock %}
{% block content %}
<div class="card">
  <h2>My Todos</h2>
  <form method="POST" action="{{ url_for('todos.index') }}" class="form add-form">
    <input type="text" name="task" placeholder="Add a new task" />
    <button type="submit">Add</button>
  </form>

  {% if todos %}
  <ul class="todo-list">
    {% for todo in todos %}
      <li class="todo-item {% if todo.completed %}completed{% endif %}">
        <form method="POST" action="{{ url_for('todos.toggle', todo_id=todo.id) }}">
          <button class="icon" title="Toggle complete">{% if todo.completed %}✓{% else %}○{% endif %}</button>
        </form>
        <form method="POST" action="{{ url_for('todos.edit', todo_id=todo.id) }}" class="edit-form">
          <input type="text" name="task" value="{{ todo.task }}" />
          <button type="submit" class="small">Save</button>
        </form>
        <form method="POST" action="{{ url_for('todos.delete', todo_id=todo.id) }}">
          <button class="danger small" title="Delete">Delete</button>
        </form>
      </li>
    {% endfor %}
  </ul>
  {% else %}
  <p>No tasks yet. Add your first one above.</p>
  {% endif %}
</div>
{% endblock %}

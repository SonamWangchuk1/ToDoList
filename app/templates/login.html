{% extends 'base.html' %}
{% block title %}Login - Todo App{% endblock %}
{% block content %}
<div class="card">
  <h2>Login</h2>
  <form method="POST" action="{{ url_for('auth.login') }}" class="form">
    <label>Email</label>
    <input type="email" name="email" required />
    <label>Password</label>
    <input type="password" name="password" required />
    <button type="submit">Login</button>
  </form>
  <p>Don't have an account? <a href="{{ url_for('auth.signup') }}">Sign up</a></p>
  <p class="demo-hint">Use any email; a new account will be created on signup.</p>  

{% endblock %}

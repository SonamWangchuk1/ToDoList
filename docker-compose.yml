services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: todo
      POSTGRES_PASSWORD: todo
      POSTGRES_DB: todo
    volumes:
      - dbdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    environment:
      SECRET_KEY: change-me-in-prod
      DATABASE_URL: postgresql+psycopg2://todo:todo@db:5432/todo
    ports:
      - "5000:5000"
    depends_on:
      - db

volumes:
  dbdata:


